<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Para ti Negrita 💛</title>
        <link rel="icon"
          type="image/png"
          href="NileInsta.png">

        <link rel="stylesheet" href="style.css">

    </head>
    <body>

        <main class="container">

            <!-- Pantalla inicial -->
            <section id="intro" class="intro">
                <button id="startBtn" class="start-btn">
                    Preciosa tengo algo para ti 💛
                </button>
            </section>

            <!-- Contenido principal -->
            <section id="content" class="content hidden">

                <!-- Flor -->
                <div class="flower-container">

                    <!-- GIRASOL IZQUIERDO -->
                    <div class="sunflower sunflower-left">

                        <div class="flower-head">

                            <div class="petal p1"></div>
                            <div class="petal p2"></div>
                            <div class="petal p3"></div>
                            <div class="petal p4"></div>
                            <div class="petal p5"></div>
                            <div class="petal p6"></div>
                            <div class="petal p7"></div>
                            <div class="petal p8"></div>

                            <div class="flower-center"></div>

                        </div>

                        <div class="stem"></div>
                        <div class="leaf leaf-left"></div>

                    </div>


                    <!-- GIRASOL CENTRAL -->
                    <div class="sunflower sunflower-center">

                        <div class="flower-head">

                            <div class="petal p1"></div>
                            <div class="petal p2"></div>
                            <div class="petal p3"></div>
                            <div class="petal p4"></div>
                            <div class="petal p5"></div>
                            <div class="petal p6"></div>
                            <div class="petal p7"></div>
                            <div class="petal p8"></div>

                            <div class="flower-center"></div>

                        </div>

                        <div class="stem"></div>
                        <div class="leaf leaf-left"></div>
                        <div class="leaf leaf-right"></div>

                    </div>


                    <!-- GIRASOL DERECHO -->
                    <div class="sunflower sunflower-right">

                        <div class="flower-head">

                            <div class="petal p1"></div>
                            <div class="petal p2"></div>
                            <div class="petal p3"></div>
                            <div class="petal p4"></div>
                            <div class="petal p5"></div>
                            <div class="petal p6"></div>
                            <div class="petal p7"></div>
                            <div class="petal p8"></div>

                            <div class="flower-center"></div>

                        </div>

                        <div class="stem"></div>
                        <div class="leaf leaf-right"></div>

                    </div>


                    <!-- MACETA -->
                    <div class="pot">

                        <div class="pot-rim"></div>

                        <div class="pot-body"></div>

                    </div>

                </div>

                <!-- Mensajes -->
                <div id="message" class="message"></div>

                <div id="interactiveGarden"></div>

                <div id="popupMessage" class="popup-message"></div>

            </section>

        </main>

        <!-- Música -->
        <audio id="bgMusic" loop preload="auto">
            <source src="YellowColdPlay.mp3" type="audio/mpeg">
        </audio>

        <script src="app.js"></script>
    </body>
</html>
